name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # Lint tem ~180 erros pré-existentes na base hoje (principalmente
      # @typescript-eslint/no-explicit-any) — roda como aviso, não bloqueia
      # merge, até esse débito ser resolvido separadamente.
      - name: Lint (não bloqueia ainda)
        run: npm run lint
        continue-on-error: true
